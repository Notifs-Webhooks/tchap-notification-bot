services:
  notifier:
    build: .
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      NOTIFIER_CONFIG: /config.toml
      # Development-only default shared with Docs. Override it in production.
      NOTIFIER_API_TOKEN: ${NOTIFIER_API_TOKEN:-local-demo-notifier-api-token-2026}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - notifier_data:/data
      - ./config.toml:/config.toml:ro
    networks:
      default: {}
      lasuite:
        aliases:
          - notifier

volumes:
  notifier_data:

networks:
  lasuite:
    name: lasuite-network
    external: true
