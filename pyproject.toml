[project]
name = "tchap-notifier"
requires-python = ">=3.11"

[tool.poetry]
name = "tchap-notifier"
version = "0.1.0"
description = "Docs notification service for Tchap direct messages"
authors = ["Tchap Team <tech@tchap.beta.gouv.fr>"]
license = "MIT"
packages = [
    { include = "notifier" },
]

[tool.poetry.scripts]
notifier = "notifier.main:main"

[tool.poetry.dependencies]
python = "^3.11"
tchap-bot = { git = "https://code.peren.fr/open-source/tchapbot.git", branch = "main" }
pydantic = "^2.6.3"
pydantic-settings = "^2.2.1"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }

[tool.poetry.group.dev.dependencies]
ruff = "^0.4.6"
basedpyright = "^1.12.4"
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
pythonVersion = "3.11"
include = ["notifier"]

typeCheckingMode = "all"

reportAny = false
reportCallInDefaultInitializer = false
reportUnknownMemberType = false
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportUnusedFunction = false

[tool.ruff.lint]
select = [
"ALL"
]
ignore = [
    "TD",      # TODO formatting
    "ISC001",  # This rule conflicts with ruff formatter
    "ANN101",  # Missing type annotation for `self` in method
    "ANN102",  # Missing type annotation for `cls` in classmethod
    "COM812",  # Trailing comma missing
    "PLR2004", # Magic value used in comparison
    "PLR0913", # Too many arguments in function definition

    # TO BE FIXED !!
    "T201",    # `print` found
    "TRY002",  # Create your own exception
    "BLE001",  # Do not catch blind exception
    "S101",    # Use of `assert` detected
    "FIX002",  # Line contains TODO, consider resolving the issue
    "D",       # Missing docstring
    "B008",    # FastAPI uses Depends in default argument values
    "C901",    # FastAPI app factories contain several route handlers
    "E501",    # SQL queries are clearer without artificial line splitting
    "EM",      # Error messages stay close to their integration context
    "EXE002",  # The development volume preserves executable bits
    "SIM105",  # Explicit cancellation blocks better document intent
    "TCH",     # Pydantic also needs these imports at runtime
    "TRY003",  # Integration errors include server response context
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "PLW0603", # Using the global statement to update variable is discouraged
    "S105",    # Possible hardcoded password assigned
    "ANN001",  # Pytest fixtures are injected dynamically
    "ARG001",  # A fixture may be requested only for its lifecycle
]
